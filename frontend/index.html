<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config panel</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <div class="app-layout sidebar-hidden">
        <aside class="sidebar">
            <div class="sidebar-header">Команды</div>

            <div class="sidebar-section">
                <button class="sidebar-link" data-route="configs">Конфиги</button>
                <button class="sidebar-link" data-route="users">Пользователи</button>
                <button class="sidebar-link" data-route="logs">Логи</button>
                <button class="sidebar-link" data-route="bulk">Массовые операции</button>
                <button class="sidebar-link" data-route="audit">Аудит</button>
            </div>

            <div class="sidebar-spacer"></div>

            <div class="sidebar-section">
                <button class="sidebar-link" data-route="profile">Профиль</button>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-login" id="sidebar-username"></div>
                </div>
            </div>
        </aside>

        <main class="content" id="content"></main>
    </div>

    <!-- Monaco Editor -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script>
        require.config({
            paths: {
                vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'
            }
        });
        require(['vs/editor/editor.main'], function () {
            window.monacoReady = true;
            window.dispatchEvent(new Event('monaco-ready'));
        });
    </script>

    <!-- Core -->
    <script src="js/router.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <!-- Components -->
    <script src="js/components/toast.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/confirm.js"></script>
    <script src="js/components/table.js"></script>

    <!-- Pages -->
    <script src="js/pages/configs.js"></script>
    <script src="js/pages/users.js"></script>
    <script src="js/pages/logs.js"></script>
    <script src="js/pages/admin.js"></script>
    <script src="js/pages/bulk.js"></script>
    <script src="js/pages/audit.js"></script>

    <!-- App -->
    <script src="js/app.js"></script>
</body>
</html>
